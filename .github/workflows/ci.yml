name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careerpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerpilot
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable

      - run: yarn install --immutable
      - run: yarn prisma generate
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:coverage

  cli:
    name: pilot CLI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node --test

  # The project is developed on Windows too: type-check, lint and run the tests that need no database.
  windows:
    name: Windows (types, lint, unit tests, CLI)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - name: Install, generate, check
        working-directory: apps/web
        run: |
          yarn install --immutable
          yarn prisma generate
          yarn lint
          yarn typecheck
          yarn vitest run --project node --project dom
      - name: pilot CLI
        working-directory: apps/cli
        run: node --test

  # Known vulnerabilities (audit C-07). The production dependency tree must have no high advisory;
  # the full tree (build and test tools) is reported but does not block.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - name: "Production dependencies (no high advisory allowed)"
        run: yarn npm audit --environment production --severity high
      - name: "Whole tree (report only)"
        continue-on-error: true
        run: yarn npm audit --all --recursive --severity high

  # The whole product in a real browser: a production build, its own database, a fake AI server and fake job sources.
  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careerpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite adds "_e2e" to the database name and refuses any other, so it cannot touch real data.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/careerpilot
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn prisma generate
      - run: yarn build
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:e2e

  # The image people actually run must build (audit C-08), and start: against a real database it answers
  # /api/health and the owner can sign in (roadmap 1.5). The browser is only for the sign-in.
  docker:
    name: Production image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careerpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image (no push)
        run: docker build --file apps/web/Dockerfile --target production --build-arg GIT_SHA=${{ github.sha }} --tag careerpilot:ci apps/web
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable
      - name: Install the smoke test's browser
        working-directory: apps/web
        run: |
          yarn install --immutable
          yarn playwright install --with-deps chromium
      - name: Start the image and a worker against Postgres, check /api/health, sign in, queue a scan
        working-directory: apps/web
        run: node scripts/smoke-image.mjs --image careerpilot:ci --database-url postgresql://postgres:postgres@localhost:5432/careerpilot --worker
