# CareerPilot with Docker Compose. There is no published image yet, so build
# your own from this repository (never run an image you did not build or trust):
#
#   docker build --file apps/web/Dockerfile --target production --build-arg GIT_SHA=$(git rev-parse HEAD) --tag careerpilot apps/web
#
# Put CAREERPILOT_IMAGE=careerpilot, POSTGRES_PASSWORD, CAREERPILOT_PASSWORD (a
# hash of your password, from `docker run --rm -it careerpilot hash-password`)
# and CAREERPILOT_SECRET in a .env file next to this file, then:
#
#   docker compose up -d
#
# Add COMPOSE_PROFILES=ai to .env to run Ollama for a local model as well.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dossier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dossier
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossier -d dossier"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # No default on purpose: a default would pull someone else's image (audit C-01).
    image: ${CAREERPILOT_IMAGE:?Set CAREERPILOT_IMAGE to an image you built from this repository (see the top of this file)}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &careerpilot-env
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD}@db:5432/dossier
      # The worker below reads boards for "Scan now" and the schedule; with this off, the web process does it itself.
      CAREERPILOT_WORKER: ${CAREERPILOT_WORKER:-on}
      # A cron expression, in TZ, for a scan of every watched board by the worker, e.g. "0 6 * * *". Empty: no scheduled scan.
      CAREERPILOT_SCAN_SCHEDULE: ${CAREERPILOT_SCAN_SCHEDULE:-}
      CAREERPILOT_PASSWORD: ${CAREERPILOT_PASSWORD:?Set CAREERPILOT_PASSWORD in .env to a hash from hash-password}
      CAREERPILOT_SECRET: ${CAREERPILOT_SECRET:?Set CAREERPILOT_SECRET in .env}
      CAREERPILOT_BACKUP_RETENTION_DAYS: ${CAREERPILOT_BACKUP_RETENTION_DAYS:-}
      # Your time zone, e.g. Europe/Berlin: nightly backups run at 03:00 in it.
      TZ: ${TZ:-UTC}
      CAREERPILOT_AI_PROVIDER: ${CAREERPILOT_AI_PROVIDER:-}
      CAREERPILOT_AI_URL: ${CAREERPILOT_AI_URL:-}
      CAREERPILOT_AI_MODEL: ${CAREERPILOT_AI_MODEL:-}
      CAREERPILOT_AI_KEY: ${CAREERPILOT_AI_KEY:-}
      CAREERPILOT_AI_TIMEOUT_SECONDS: ${CAREERPILOT_AI_TIMEOUT_SECONDS:-}
      # Defaults for Settings → Job search.
      CAREERPILOT_JOBS_SOURCE: ${CAREERPILOT_JOBS_SOURCE:-}
      CAREERPILOT_JSEARCH_KEY: ${CAREERPILOT_JSEARCH_KEY:-}
      CAREERPILOT_JSEARCH_HOST: ${CAREERPILOT_JSEARCH_HOST:-}
      CAREERPILOT_ADZUNA_APP_ID: ${CAREERPILOT_ADZUNA_APP_ID:-}
      CAREERPILOT_ADZUNA_KEY: ${CAREERPILOT_ADZUNA_KEY:-}
      CAREERPILOT_FREEHIRE_URL: ${CAREERPILOT_FREEHIRE_URL:-}
      CAREERPILOT_JOBS_ARBEITSAGENTUR: ${CAREERPILOT_JOBS_ARBEITSAGENTUR:-}
      # Defaults for Settings → Scoring: ai or jev (Jev by TypeSafe, with its key).
      CAREERPILOT_SCORER: ${CAREERPILOT_SCORER:-}
      CAREERPILOT_TYPESAFE_KEY: ${CAREERPILOT_TYPESAFE_KEY:-}
      # Gmail and Calendar: a Google OAuth client (or enter it in Settings → Google).
      CAREERPILOT_GOOGLE_CLIENT_ID: ${CAREERPILOT_GOOGLE_CLIENT_ID:-}
      CAREERPILOT_GOOGLE_CLIENT_SECRET: ${CAREERPILOT_GOOGLE_CLIENT_SECRET:-}
      # The address Dossier is reached at, for Google's redirect.
      CAREERPILOT_PUBLIC_URL: ${CAREERPILOT_PUBLIC_URL:-}
    # Only on the server itself: put a reverse proxy with HTTPS in front.
    ports:
      - "127.0.0.1:${CAREERPILOT_PORT:-3000}:3000"
    volumes:
      - data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g
    # Lets http://host.docker.internal reach Ollama (:11434) or LM Studio
    # (:1234) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The worker (docs/adr/0004): the same image and settings, serving the job queue. It waits for the app to apply the
  # migrations. Remove this service and set CAREERPILOT_WORKER=off to run everything in the app container instead.
  worker:
    image: ${CAREERPILOT_IMAGE:?Set CAREERPILOT_IMAGE to an image you built from this repository (see the top of this file)}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "/app/tools/worker.mjs"]
    environment: *careerpilot-env
    healthcheck:
      disable: true
    mem_limit: 512m

  # A local model, with COMPOSE_PROFILES=ai in .env: `docker compose up -d`,
  # then pull one (see "Choosing an AI provider" in the wiki). Dossier reaches it at http://ollama:11434.
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  data:
  ollama:
